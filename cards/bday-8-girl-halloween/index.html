<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21132c">
  <title>A spellbinding eighth birthday invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin="anonymous"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,800,100,1&display=swap">
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff7e8;
      --muted: #d7c8dd;
      --night: #180f22;
      --plum: #291536;
      --pumpkin: #f58a3a;
      --pink: #e56091;
      --lilac: #c4a1e7;
      --acid: #d9e96c;
      --line: #ffffff24;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 280px;
      color: var(--ink);
      background: var(--night);
      background-image: radial-gradient(#c4a1e733 1px, transparent 1px),
        radial-gradient(circle at 12% 8%, #6e386b66, transparent 28%);
      background-size: 20px 20px, auto;
      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(1080px, 100%);
      margin-inline: auto;
      padding: clamp(16px, 4vw, 56px) clamp(12px, 3vw, 32px) 32px;
    }

    .edition, .eyebrow, .detail-label, .footer {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .edition { display: flex; justify-content: space-between; gap: 16px; margin: 0 4px 16px; color: var(--muted); }

    .invitation {
      overflow: hidden;
      border: 1px solid #ffffff1c;
      border-radius: 24px;
      background: var(--plum);
      box-shadow: 0 28px 80px -28px #000, 0 2px 0 #ffffff12 inset;
    }

    .hero { display: grid; grid-template-columns: 1fr 1fr; }

    .hero-copy {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      padding: clamp(28px, 5vw, 60px);
      padding-bottom: 0;
    }

    .event-intro {
      grid-column: 1;
      grid-row: 2;
      min-width: 0;
      padding: 0 clamp(28px, 5vw, 60px) clamp(28px, 5vw, 60px);
    }

    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 26px; color: var(--lilac); }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: currentColor; }

    h1 {
      margin: 0;
      color: var(--pumpkin);
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(64px, 8vw, 96px);
      font-weight: 800;
      line-height: .96;
      letter-spacing: -.065em;
      text-shadow: 3px 3px 0 #71345c;
    }
    h1 span { display: block; }

    .spark-line { display: flex; gap: 10px; margin: 18px 0 22px; color: var(--pink); }
    .spark-line span:nth-child(2) { color: var(--acid); transform: translateY(4px) scale(.7); }

    #title { font-size: clamp(21px, 2.7vw, 29px); font-weight: 700; line-height: 1.25; letter-spacing: -.035em; }
    #title:empty::before { content: "A frightfully fun birthday bash!"; }
    #notes:empty::before { content: "Sweet treats, silly spells, and one magical birthday girl."; }
    #notes { max-width: 34ch; margin-top: 14px; color: var(--muted); font-size: 15px; }

    .art-panel {
      grid-column: 2;
      grid-row: 1 / span 2;
      display: grid;
      place-items: center;
      min-width: 0;
      background: #8f5b9c;
      background-image: linear-gradient(#ffffff0d 1px, transparent 1px),
        linear-gradient(90deg, #ffffff0d 1px, transparent 1px),
        radial-gradient(circle at 50% 44%, #ba83bc, #74427f);
      background-size: 40px 40px, 40px 40px, auto;
    }

    .birthday-art { display: block; width: 100%; height: auto; max-height: 570px; padding: 10px; }

    .party-strip {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 26px;
      padding: 16px 20px;
      background: var(--pumpkin);
      color: #331529;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .party-strip .star { font-size: 17px; line-height: 1; }

    .content { display: grid; gap: 28px; padding: clamp(24px, 4.5vw, 48px); background: #fff8e9; color: #43253f; }
    .section-heading { display: flex; align-items: center; gap: 18px; }
    .section-heading::after { content: ""; height: 1px; flex: 1; background: #69435c33; }
    h2 { margin: 0; font: 800 clamp(26px, 3vw, 32px)/1.2 "Fraunces", Georgia, serif; letter-spacing: -.04em; }

    .details { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 24px; }
    .detail { min-width: 0; }
    .detail + .detail { padding-left: 24px; border-left: 1px solid #69435c33; }
    .detail-label { display: block; margin-bottom: 8px; color: #a72d62; }
    #date, #time, #location { font-size: 18px; font-weight: 600; line-height: 1.45; }
    #address { margin-top: 6px; color: #75576d; font-size: 14px; }
    #date:empty::before { content: "Date to come"; }
    #time:empty::before { content: "Time to come"; }
    #location:empty::before { content: "Haunt to come"; }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    a { color: #a72d62; text-underline-offset: 4px; }
    #calendar_link a, #registry_link a, .oi-submit {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      padding: 12px 22px;
      border: 1px solid #a72d62;
      border-radius: 999px;
      background: #a72d62;
      color: #fff8e9;
      font: 700 14px/1.4 "DM Sans", sans-serif;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    #registry_link a { color: #a72d62; background: transparent; }
    #notes_2, #notes_3, #host_names, #guest_message { color: #75576d; }
    #notes_2:not(:empty) { padding: 20px 24px; border-left: 3px solid #a72d62; border-radius: 0 12px 12px 0; background: #f1e3ef; }

    .rsvp { display: grid; gap: 20px; padding: clamp(20px, 3.5vw, 32px); border: 1px solid #d7bfd8; border-radius: 18px; background: #f0e4f2; }
    .rsvp-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .rsvp-heading span { color: #a72d62; font-size: 28px; }
    .attendance { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; }
    #guest_name { font-weight: 700; }
    #map_link .oi-map-embed { display: block; width: 100%; height: clamp(240px, 40vw, 360px); border: 0; border-radius: 16px; }

    .oi-rsvp-form { display: grid; gap: 18px; }
    .oi-guest-name { font-weight: 700; }
    .oi-field { display: grid; gap: 8px; min-width: 0; }
    .oi-label { font-size: 13px; font-weight: 600; }
    .oi-input, .oi-textarea { width: 100%; min-width: 0; min-height: 48px; padding: 12px 14px; border: 1px solid #ad91ae; border-radius: 10px; background: #fffdf8; color: #43253f; font: inherit; font-size: 16px; }
    .oi-textarea { min-height: 110px; resize: vertical; }
    .oi-rsvp-options { display: flex; flex-wrap: wrap; gap: 10px; }
    .oi-rsvp-option { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 16px; border: 1px solid #ad91ae; border-radius: 12px; background: #fffdf8; cursor: pointer; }
    .oi-rsvp-option:has(input:checked) { border-color: #a72d62; background: #f9dce8; }
    .oi-rsvp-option input { width: 18px; height: 18px; margin: 0; accent-color: #a72d62; flex-shrink: 0; }
    .oi-submit { justify-self: start; }
    :focus-visible { outline: 3px solid #8f4caf; outline-offset: 4px; }

    .print-hosts { display: none; }
    .content > div:empty, .actions > div:empty, .attendance > div:empty, .rsvp > div:empty,
    #address:empty, .actions:not(:has(a)), .attendance:not(:has(> div:not(:empty))),
    .rsvp:not(:has(#response:not(:empty), #guest_name:not(:empty), #expected_adults:not(:empty), #expected_kids:not(:empty), #expected_total:not(:empty), #guest_message:not(:empty))) { display: none; }
    [id] { overflow-wrap: anywhere; }
    [id] img { max-width: 100%; height: auto; }
    .footer { margin: 22px 0 0; color: var(--muted); text-align: center; font-size: 10px; }
    .footer span { margin-inline: 10px; color: var(--pumpkin); }

    @media (max-width: 640px) {
      .edition { font-size: 9px; letter-spacing: .1em; }
      .invitation { border-radius: 18px; }
      .hero { grid-template-columns: 1fr; }
      .hero-copy { grid-column: 1; grid-row: 1; align-items: center; padding: 36px 24px 0; text-align: center; }
      .event-intro { grid-column: 1; grid-row: 2; padding: 0 24px 30px; text-align: center; }
      .event-intro > div { margin-inline: auto; }
      .art-panel { grid-column: 1; grid-row: 3; }
      .eyebrow { margin-bottom: 22px; }
      h1 { font-size: clamp(64px, 14vw, 88px); }
      h1 span:first-child { display: inline; }
      .birthday-art { max-height: 350px; padding: 6px; }
      .party-strip { gap: 10px 14px; font-size: 9px; letter-spacing: .1em; }
      .details { grid-template-columns: 1fr 1fr; gap: 22px 16px; }
      .detail + .detail { padding-left: 16px; }
      .detail:last-child { grid-column: 1 / -1; padding: 20px 0 0; border-top: 1px solid #69435c33; border-left: 0; }
      .oi-rsvp-options { flex-direction: column; }
      .oi-submit { width: 100%; }
    }

    /* OpenInvite 5 x 7 export at 480 x 672 CSS px. */
    html.oi-print { --oi-print-qr-size: 120px; --oi-print-qr-padding: 0; }
    html.oi-print body { min-width: 0; background: var(--night); font-size: 13px; line-height: 1.4; }
    html.oi-print main { width: 100%; margin: 0; padding: 0; }
    html.oi-print .invitation { display: grid; grid-template-rows: minmax(350px, 1fr) auto auto; min-height: 672px; overflow: visible; border: 0; border-radius: 0; box-shadow: none; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    html.oi-print :is(.edition, .footer, .section-heading, .rsvp-heading, .attendance, .actions, #notes, #notes_2, #notes_3, #guest_message, #map_link, #registry_link, #calendar_link, .oi-rsvp-form) { display: none; }
    html.oi-print .hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-rows: minmax(260px, 1fr) auto; min-height: 350px; }
    html.oi-print .hero-copy { grid-column: 1; grid-row: 1; display: block; padding: 32px 18px 28px 24px; text-align: left; }
    html.oi-print .eyebrow { gap: 6px; margin: 0 0 24px; font-size: 8px; letter-spacing: .09em; }
    html.oi-print .eyebrow::before { width: 12px; }
    html.oi-print h1, html.oi-print h1 span { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-style: normal; font-optical-sizing: none; font-variation-settings: "opsz" 72, "wght" 800, "SOFT" 100, "WONK" 1; }
    html.oi-print h1 { display: block; margin: 0; padding: 0; font-size: 48px; line-height: 60px; letter-spacing: -.045em; }
    html.oi-print h1 span { display: block; min-height: 60px; }
    html.oi-print .spark-line { display: none; }
    html.oi-print .event-intro { grid-column: 1 / -1; grid-row: 2; padding: 24px; background: var(--plum); text-align: left; }
    html.oi-print .art-panel { grid-column: 2; grid-row: 1; }
    html.oi-print #title { max-width: none; margin: 0; font-size: 22px; line-height: 1.3; }
    html.oi-print .birthday-art { width: 100%; max-height: 280px; padding: 4px; }
    html.oi-print .party-strip { gap: 12px; padding: 10px 20px; font-size: 8px; letter-spacing: .1em; }
    html.oi-print .party-strip .star { font-size: 12px; }
    html.oi-print .content { grid-template-columns: minmax(0, 1fr) 144px; align-items: start; gap: 16px 20px; padding: 26px 24px; }
    html.oi-print .details { grid-column: 1; grid-row: 1; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 12px; }
    html.oi-print .detail + .detail { padding-left: 12px; }
    html.oi-print .detail:last-child { grid-column: 1 / -1; padding: 16px 0 0; border-top: 1px solid #69435c33; border-left: 0; }
    html.oi-print .detail-label { margin-bottom: 6px; font-size: 8px; letter-spacing: .1em; }
    html.oi-print :is(#date, #time, #location) { font-size: 14px; line-height: 1.35; }
    html.oi-print #address { margin-top: 6px; font-size: 12px; line-height: 1.4; }
    html.oi-print #host_names:not(:empty) { display: block; grid-column: 1; grid-row: 2; font-size: 12px; }
    html.oi-print .rsvp:has(#response:not(:empty)) { display: block; grid-column: 2; grid-row: 1 / span 2; min-width: 0; padding: 12px; border: 0; border-radius: 0; background: white; color: #222; text-align: center; }
    html.oi-print #response { width: 100%; min-width: 0; font-size: 11px; line-height: 1.4; }
    html.oi-print #response * { max-width: 100%; }
    html.oi-print #response :is(img, svg, canvas) { display: block; width: 120px; height: auto; margin-inline: auto; border-radius: 0; }
  </style>
</head>

<body>
  <main>
    <div class="edition"><span>A spellbinding invitation</span><span>Birthday edition · No. 08</span></div>
    <article class="invitation" aria-label="Halloween eighth birthday invitation">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Come for a birthday spell</p>
          <h1><span>Eight</span> <span>is great!</span></h1>
          <div class="spark-line" aria-hidden="true"><span>✦</span><span>✦</span><span>✦</span></div>
        </div>
        <div class="event-intro"><div id="title"></div><div id="notes"></div></div>
        <div class="art-panel">
          <svg class="birthday-art" viewBox="0 0 460 540" fill="none" aria-hidden="true">
            <defs>
              <g id="bat" fill="#27122f">
                <path d="M0 8C-14-5-27-7-39 0c7 4 10 11 10 20 8-6 17-7 29-3 12-4 21-3 29 3 0-9 3-16 10-20C27-7 14-5 0 8Z" />
              </g>
              <g id="star" fill="currentColor"><path d="M0-18C3-5 5-3 18 0 5 3 3 5 0 18-3 5-5 3-18 0-5-3-3-5 0-18Z" /></g>
            </defs>
            <circle cx="230" cy="268" r="184" fill="#341841" opacity=".28" />
            <path d="M229 96c-3-22 11-39 32-42-5 13-2 25 10 36" stroke="#566b38" stroke-width="16" stroke-linecap="round" />
            <g transform="rotate(-6 230 285)">
              <ellipse cx="230" cy="192" rx="133" ry="108" fill="#f58a3a" stroke="#2a142d" stroke-width="3" />
              <ellipse cx="230" cy="375" rx="145" ry="118" fill="#f58a3a" stroke="#2a142d" stroke-width="3" />
              <path d="M174 102c-27 48-29 125 0 177M286 101c27 49 29 126 0 180M164 276c-28 51-27 147 3 196M296 276c29 53 27 150-4 199" stroke="#de6d2b" stroke-width="8" stroke-linecap="round" opacity=".9" />
              <path d="m177 167 34-19-10 37-24-18Zm106 0-34-19 10 37 24-18Z" fill="#32162f" />
              <path d="M170 213q60 54 120 0c-6 60-114 60-120 0Z" fill="#32162f" />
              <path d="m174 351 38-21-11 41-27-20Zm112 0-38-21 11 41 27-20Z" fill="#32162f" />
              <path d="M164 404q66 58 132 0c-7 66-125 66-132 0Z" fill="#32162f" />
              <path d="M216 224h28l-14-23-14 23Zm0 191h28l-14-23-14 23Z" fill="#f7cc67" />
              <path d="M150 88c18-22 46-28 67-13-9 4-15 11-18 21-17-10-33-9-49-8Z" fill="#e56091" />
              <path d="M143 87c-17-2-29 7-36 26 19 2 32-5 39-21m8-2c10 18 25 23 44 15-9-17-23-23-41-18" fill="#e56091" stroke="#5d244a" stroke-width="2" />
              <circle cx="151" cy="88" r="12" fill="#c4a1e7" />
            </g>
            <use href="#bat" transform="translate(83 111) rotate(-15) scale(.8)" />
            <use href="#bat" transform="translate(376 168) rotate(13) scale(.65)" />
            <use href="#bat" transform="translate(75 422) rotate(10) scale(.5)" />
            <use href="#star" transform="translate(370 345)" color="#d9e96c" />
            <use href="#star" transform="translate(93 280) scale(.7)" color="#e56091" />
            <circle cx="365" cy="83" r="6" fill="#e56091" />
            <circle cx="51" cy="242" r="5" fill="#fff7e8" />
            <path d="m322 53 6 13m63 205 12-5M112 493l8-11" stroke="#d9e96c" stroke-width="4" stroke-linecap="round" />
            <g transform="rotate(8 336 102)">
              <rect x="266" y="78" width="140" height="48" rx="24" fill="#e56091" />
              <text x="336" y="107" fill="#fff7e8" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">BOO-TIFUL EIGHT!</text>
            </g>
          </svg>
        </div>
      </header>
      <div class="party-strip"><span>Tricks & treats</span><span class="star" aria-hidden="true">✦</span><span>Birthday magic</span><span class="star" aria-hidden="true">✦</span><span>Costumes welcome</span></div>
      <div class="content">
        <div class="section-heading"><h2>The spooky details</h2></div>
        <div class="details">
          <div class="detail"><span class="detail-label">01 / The night</span><div id="date"></div></div>
          <div class="detail"><span class="detail-label">02 / Witching hour</span><div id="time"></div></div>
          <div class="detail"><span class="detail-label">03 / The haunt</span><div id="location"></div><div id="address"></div></div>
        </div>
        <div id="host_names" class="print-hosts"></div>
        <div class="actions"><div id="calendar_link"></div><div id="registry_link"></div></div>
        <div id="notes_2"></div><div id="map_link"></div>
        <section class="rsvp" aria-labelledby="rsvp-heading">
          <div class="rsvp-heading"><h2 id="rsvp-heading">Will you join the coven?</h2><span aria-hidden="true">☾</span></div>
          <div class="attendance"><div id="guest_name"></div><div id="expected_adults"></div><div id="expected_kids"></div><div id="expected_total"></div></div>
          <div id="response"></div><div id="guest_message"></div>
        </section>
        <div id="notes_3"></div>
      </div>
    </article>
    <p class="footer">Sweetly spooky <span aria-hidden="true">✦</span> Celebrated with magic</p>
  </main>
</body>

</html>
